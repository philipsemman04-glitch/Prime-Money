<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef1f6">
  <title>Team Prime</title>
  <link rel="icon" type="image/png" href="/logo-mark.png">
  <link rel="apple-touch-icon" href="/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Signed-in app: sidebar + top bar + page -->
  <div class="shell" id="shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="#/" aria-label="Home">
        <img src="/logo-mark.png" alt="" width="34" height="34">
        <span class="brand-text" id="brand">Team Prime</span>
      </a>
      <div class="side-label">Menu</div>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="side-label">Tools</div>
      <div class="side-tool">
        <span>Currency</span>
        <div class="seg" id="currency" role="group" aria-label="Display currency"></div>
      </div>
      <div class="side-widget" id="side-widget"></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <a class="topbar-brand" href="#/"><img src="/logo-mark.png" alt="" width="30" height="30"></a>
        <div class="topbar-title" id="page-title"></div>
        <div class="topbar-right">
          <a class="icon-btn bell" id="bell" href="#/requests" aria-label="Requests"></a>
          <button class="avatar-btn" id="avatar" title="Account" aria-label="Account"></button>
          <button class="icon-btn" id="logout" title="Log out" aria-label="Log out"></button>
          <a class="btn cta" href="#/requests/new" id="cta">Request funds</a>
        </div>
      </header>
      <main id="app" class="page"></main>
    </div>
  </div>

  <!-- Signed-out pages: setup, sign in, invite -->
  <main id="public" hidden></main>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
