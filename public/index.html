<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061654">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Prime">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Team Prime</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/logo-mark.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Opening animation: the P rolls in, PRIME slides out of it, then "Welcome back". -->
  <div id="intro" aria-hidden="true">
    <div class="intro-stage">
      <svg class="intro-mark" viewBox="-12 -12 530 124">
        <defs>
          <linearGradient id="ig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd76e"/><stop offset="1" stop-color="#f0a92a"/></linearGradient>
          <clipPath id="ic"><rect id="intro-wipe" x="104" y="-20" width="0" height="140"><animate attributeName="width" from="0" to="440" begin="0.95s" dur="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.3 0.7 0.2 1"/></rect></clipPath>
        </defs>
        <g class="intro-shift">
          <g clip-path="url(#ic)"><g class="il il-r"><path fill="#fff" fill-rule="evenodd" d="M116 0H188A28 28 0 0 1 216 28V36A28 28 0 0 1 188 64H138V100H116Z M138 22V42H188A6 6 0 0 0 194 36V28A6 6 0 0 0 188 22Z M162 72H188L216 100H190Z"/></g><g class="il il-i"><path fill="#fff" fill-rule="evenodd" d="M232 0H254V100H232Z"/></g><g class="il il-m"><path fill="url(#ig)" fill-rule="evenodd" d="M270 100V0H298L332 50L361 7.4V48.3L342 82H322L292 38V100Z M371 0H394V100H371Z"/></g><g class="il il-e"><path fill="#fff" fill-rule="evenodd" d="M410 0H506V22H410Z M410 39H488V61H410Z M410 78H506V100H410Z"/></g></g>
          <g class="il-p"><path fill="#fff" fill-rule="evenodd" d="M0 0H72A28 28 0 0 1 100 28V36A28 28 0 0 1 72 64H22V100H0Z M22 22V42H72A6 6 0 0 0 78 36V28A6 6 0 0 0 72 22Z"/></g>
        </g>
      </svg>
      <div class="intro-greet"><span>Welcome back,</span><b id="intro-name"></b></div>
    </div>
  </div>
  <script>
    window.__introStart = performance.now();
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      var wipe = document.getElementById('intro-wipe');
      wipe.innerHTML = '';
      wipe.setAttribute('width', '440');
    }
    // Safety net: never let the intro cover the app if something goes wrong.
    setTimeout(function () { var el = document.getElementById('intro'); if (el) el.remove(); }, 9000);
  </script>
  <!-- Signed-in app: sidebar + top bar + page -->
  <div class="shell" id="shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="#/" aria-label="Home">
        <img class="brand-wordmark" src="/prime-wordmark.svg" alt="Prime" width="132" height="24">
      </a>
      <div class="side-label">Menu</div>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="side-label">Tools</div>
      <div class="side-tool">
        <span>Currency</span>
        <div class="seg" id="currency" role="group" aria-label="Display currency"></div>
      </div>
      <div class="side-widget" id="side-widget"></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <a class="topbar-brand" href="#/"><img src="/logo-mark.png" alt="" width="30" height="30"></a>
        <div class="topbar-title" id="page-title"></div>
        <div class="topbar-right">
          <a class="icon-btn bell" id="bell" href="#/requests" aria-label="Requests"></a>
          <button class="avatar-btn" id="avatar" title="Account" aria-label="Account"></button>
          <button class="icon-btn" id="logout" title="Log out" aria-label="Log out"></button>
          <a class="btn cta" href="#/requests/new" id="cta">Request funds</a>
        </div>
      </header>
      <main id="app" class="page"></main>
    </div>
  </div>

  <!-- Signed-out pages: setup, sign in, invite -->
  <main id="public" hidden></main>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
