<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e16">
  <title>Team Prime</title>
  <link rel="icon" type="image/png" href="/logo-mark.png">
  <link rel="apple-touch-icon" href="/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/" aria-label="Home">
      <img src="/logo-mark.png" alt="" width="36" height="36">
      <span class="brand-text" id="brand">Team Prime</span>
    </a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="top-right">
      <div class="seg cur-switch" id="currency" role="group" aria-label="Display currency"></div>
      <div class="who">
        <span class="avatar" id="who-avatar" aria-hidden="true"></span>
        <span class="who-name" id="who-name"></span>
        <button class="icon-btn" id="logout" title="Log out" aria-label="Log out">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main id="app" class="container"></main>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
